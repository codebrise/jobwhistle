name = "jobwhistle-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/1 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "jobwhistle-production"
database_id = "jobwhistle-db-placeholder"

[vars]
APP_ENV = "production"
APP_URL = "https://jobwhistle.codebrise.com"
WEB_ORIGIN = "https://jobwhistle.codebrise.com"
EMAIL_FROM = "Jobwhistle <alerts@jobwhistle.codebrise.com>"

